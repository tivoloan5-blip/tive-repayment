<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
}

.header{

background:linear-gradient(#ff9800,#ff9800,#ffd18b);

height:270px;

padding:20px;

color:#fff;

position:relative;

}

.title{

font-size:24px;

font-weight:bold;

}

.help{

position:absolute;

right:15px;

top:18px;

border:2px solid #fff;

padding:10px 20px;

border-radius:30px;

font-size:22px;

font-weight:bold;

}

.profile{

margin-top:45px;

display:flex;

align-items:center;

}

.profile img{

width:110px;

height:110px;

border-radius:50%;

background:#fff;

}

.info{

margin-left:18px;

}

.name{

font-size:28px;

font-weight:bold;

}

.legend{

display:inline-block;

background:#8d22ff;

padding:8px 18px;

border-radius:8px;

font-size:18px;

margin-top:8px;

}

.edit{

position:absolute;

right:20px;

top:145px;

border:2px solid white;

border-radius:30px;

padding:10px 28px;

font-size:22px;

}

.stats{

background:white;

display:flex;

justify-content:space-around;

padding:20px 0;

text-align:center;

}

.stats h2{

font-size:18px;

color:#777;

margin-bottom:10px;

}

.stats p{

font-size:22px;

font-weight:bold;

}

.level{

margin:18px;

background:linear-gradient(90deg,#7d00d4,#d34dff);

border-radius:18px;

padding:28px;

color:white;

font-size:30px;

font-weight:bold;

}

.menu{

background:white;

margin:18px;

border-radius:15px;

overflow:hidden;

}

.item{

display:flex;

justify-content:space-between;

align-items:center;

padding:24px;

font-size:22px;

font-weight:bold;

border-bottom:1px solid #ddd;

}

.item:last-child{

border:none;

}

.left{

display:flex;

align-items:center;

}

.left span{

color:#ff9800;

font-size:32px;

margin-right:18px;

}

.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

height:65px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -2px 8px rgba(0,0,0,.15);

}

.bottom .material-icons{

font-size:34px;

color:#bbb;

}

.active{

color:#ff9800 !important;

}

</style>

</head>

<body>

<div class="header">

<div class="title">

Tivo, Ready for You

</div>

<div class="help">

? Help

</div>

<div class="profile">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<div class="info">

<div class="name">

PADM...

</div>

<div class="legend">

Legend

</div>

</div>

</div>

<div class="edit">

Edit

</div>

</div>

<div class="stats">

<div>

<h2>Due</h2>

<p>6</p>

</div>

<div>

<h2>Trust</h2>

<p>21</p>

</div>

<div>

<h2>Limit</h2>

<p>₹38,900</p>

</div>

</div>

<div class="level">

Level Card

</div>
<div class="menu">

<div class="item">

<div class="left">

<span class="material-icons">edit</span>

Higher Credit&Lower Fees

</div>

<span class="material-icons">
chevron_right
</span>

</div>


<div class="item">

<div class="left">

<span class="material-icons">
credit_card
</span>

Update Card

</div>

<span class="material-icons">
chevron_right
</span>

</div>


<div class="item">

<div class="left">

<span class="material-icons">
settings
</span>

Settings

</div>

<span class="material-icons">
chevron_right
</span>

</div>

</div>


<div class="bottom">

<span class="material-icons"
onclick="window.location.href='index.html'">
home
</span>

<span class="material-icons"
onclick="window.location.href='index.html'">
credit_card
</span>

<span class="material-icons active">
person
</span>

</div>

</body>

</html>
